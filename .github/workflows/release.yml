name: Release

# Scope note (issue #250): this workflow only derives the next version from
# Conventional Commits and publishes tag + changelog + GitHub Release. It
# does not run lint/type/test — the local quality gate documented in
# CLAUDE.md stays the pre-push responsibility. Gating this job behind a
# CI test run is deliberately out of scope here; see issue #250's
# discussion for why.
#
# Trigger changed from `push: [main]` to manual (issue #283): every merged
# PR was pushing to main and firing its own release, producing one tag per
# PR regardless of how those changes actually reach production (deploy is a
# separate, manual, batched step — see docs/deployment.md). Manual dispatch
# lets the product owner run this once per deploy batch; semantic-release
# still walks every commit since the last tag on `main` (per
# .releaserc.json's `branches: ["main"]`), so nothing between releases is
# dropped from the changelog regardless of how long the gap is.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
