name: Release

# Scope note (issue #250): this workflow only derives the next version from
# Conventional Commits and publishes tag + changelog + GitHub Release. It
# does not run lint/type/test — the local quality gate documented in
# CLAUDE.md stays the pre-push responsibility. Gating this job behind a
# CI test run is deliberately out of scope here; see issue #250's
# discussion for why.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
