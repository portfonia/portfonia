[project]
name = "vigil-backend"
version = "0.0.1"
description = "Vigil backend (FastAPI + Celery) — isolated from Portfonia"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "B008",
]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["alembic/versions/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["vigil_app"]
python_files = ["test_*.py", "*_test.py"]
