# Chinese-language compliance vocabulary data for app/compliance/forbidden_vocab.py
# (issue #90 follow-up: the literal Chinese term/pattern data moved out of
# that module's .py source into this dedicated data file; forbidden_vocab.py
# is now pure loading + compilation logic. Its public API — FORBIDDEN_OUTPUT_
# PATTERNS, PROMPT_VOCAB_STRING, build_scan_patterns(), build_prompt_vocab_
# string() — is unchanged; this is a data-source move, not a behavior change).
#
# forbidden_vocab.py remains the single source of truth for *behavior*. Do
# not edit an entry here without re-running the compliance-scan regression
# tests (test_scan_* in app/tests/test_output_scan.py — especially the
# 止损 / 清仓 context-aware fixtures, which encode a specific, hard-won
# distinction between advisory-directive and third-party-action phrasing).

# --- scan_terms: unambiguous advisory literal matches (bare substring) ---
# Principle: the scan is a backstop for unambiguous direct-advisory language
# only. Terms that routinely appear in factual financial news as descriptions
# of third-party actions (e.g. "机构增持XX", "银行下调目标价") are NOT scanned —
# they belong in prompt_only_terms instead, where the model is told to avoid
# them, but a factual reference does not trigger a needs_review hold.
#
# The four moderate-risk terms (目标价/增持/减持/入场) were moved to
# prompt_only_terms after report 11797c1c was incorrectly held for quoting
# third-party bank/institution actions (issue #65).
#
# 止损 was moved to scan_regex_patterns (below) after report 9b61b18e was
# incorrectly held — see that section's comment for the full history.
# 清仓 followed the same path after report 2aee4d47 (issue #205): a named
# fund's disclosed exit is Layer 1/2, but "建议清仓" is still a hard Layer-4
# hit, so it is not a prompt_only_terms candidate the way 增持/减持 were.
scan_terms:
  - term: 强烈买入 # strong buy rating
  - term: 投资建议 # investment advice
  - term: 超买 # overbought
  - term: 超卖 # oversold

# --- scan_regex_patterns: context-aware 止损 / 清仓 disambiguation ---
# Unlike scan_terms (bare literal match), these only fire when 止损 appears as
# an instruction to the user, not as a description of stop-loss orders
# triggering in the market.
#
# Blocks: "建议止损" / "应该止损" / "止损位/点/价在100" / "立即止损" /
#         "跌破91.50止损" / "建议投资者止损" / "应该马上进行止损" /
#         "建议止损。注意风险" / "建议止损并注意流动性"
# Allows: "止损驱动的抛售" / "触发止损盘" / "止损盘涌现" / "应该注意到止损盘涌现" /
#         "立即触发止损盘" / "触及止损线" / "跌破后触发止损" / "价格触及止损"
#         (third-party market action, or Layer-3 "worth watching" phrasing)
#
# History (issue #74):
# v1 tightened the modal-verb gap from 0-6 to 0-2 chars to exclude "应该注意
# 到止损盘涌现" — silently dropped real advisory phrasing with a 3+ char
# subject/adverb ("建议投资者止损" / "应该马上进行止损").
# v2 kept the 0-6 gap and added a negative lookahead `(?!.{0,6}?(关注|...))`
# instead — but `.` in a lookahead is unbounded, so it could see PAST 止损
# into the next clause: "建议止损。注意风险" was wrongly excluded because 注意
# appears 3 chars after 止损, not because it appears between 建议 and 止损.
# v3 (this version) uses a per-character walk `(?:(?!关注|...)[^。,，、\n]){0,6}`
# so the hedge-verb exclusion only applies to the gap BETWEEN the modal verb
# and 止损, never past it — caught in PR review before merge (GitHub PR #75).
#
# The level-breaking pattern similarly went through two iterations: v1 only
# excluded a fixed set of trailing nouns (位/点/价/驱动/盘/单), which still
# flagged "触及止损线" (线 not in the set) and, more importantly, flagged bare
# descriptive sentences with no price at all ("跌破后触发止损" / "价格触及止损").
# v2 (this version) requires a digit to appear between the level verb and
# 止损 — a concrete price/level is the actual signal that distinguishes a
# directive ("跌破91.50止损") from generic market narration, so this is a
# structural fix rather than another entry in the trailing-noun list.
#
# 清仓 (liquidate entire position), issue #205 / PR #206:
# Modal + temporal reuse 止损's v3 per-character walk. Unlike 止损, there is
# no 清仓位 construct, so the compensating nets are different: urgency
# adverb 尽快, adjacent 全部/直接/完全 (completed-aspect 了 excluded so
# "完全清仓了英特尔头寸" still allows), and a level-break+digit arm
# mirroring 止损 ("跌破90就清仓"). Temporal lookbehind drops 被迫/强制
# (forced-liquidation narration); gap verbs 披露/宣布/启动/公告 and
# trailing 了/程序/计划/动作/流程 drop process/filing shapes.
# Accepted residual (covering them is the #205 false-positive): bare
# "清仓该持仓" / "分批清仓", and "责令其马上清仓" (force-verb is not
# adjacent to the adverb, so a fixed-width lookbehind cannot see it).
# Blocks: "建议清仓" / "应该立即清仓" / "立即清仓" / "建议投资者清仓" /
#         "应该马上进行清仓" / "建议清仓。注意风险" / "尽快清仓" /
#         "全部清仓，不要犹豫" / "直接清仓" / "跌破90就清仓" /
#         "立即把手里的仓位清仓"
# Allows: "完全清仓了英特尔头寸" / "披露清仓该持仓" / "该机构清仓了" /
#         "建议关注该机构清仓动作" / "立即披露清仓该持仓" /
#         "多头被迫立即清仓离场" / "该ETF立刻启动清仓程序" /
#         "公司马上公告清仓计划"
#
# Single-quoted YAML scalars below: no backslash-escape processing, so the
# regex source is byte-identical to what re.compile receives (matches the
# original Python raw-string literals).
scan_regex_patterns:
  - '(建议|应该|需要|请)(?:(?!关注|留意|注意|警惕)[^。,，、\n]){0,6}止损'
  - '止损[位点价]'
  - '(立即|立刻|马上|赶紧)[^。,，、\n]{0,2}止损(?!位|点|价|驱动|盘|单)'
  - '(跌破|涨破|触及|低于|高于)(?=[^。,，、\n]{0,10}\d)[^。,，、\n]{0,10}止损(?!位|点|价|线|驱动|盘|单)'
  - '(建议|应该|需要|请)(?:(?!关注|留意|注意|警惕)[^。,，、\n]){0,6}清仓'
  - '(?<!被迫)(?<!强制)(立即|立刻|马上|赶紧|尽快)(?:(?!披露|宣布|启动|公告)[^。,，、\n]){0,6}清仓(?!了|程序|计划|动作|流程)'
  - '(全部|直接|完全)清仓(?!了)'
  - '(跌破|涨破|触及|低于|高于)(?=[^。,，、\n]{0,10}\d)[^。,，、\n]{0,10}清仓(?!了)'

# --- prompt_only_terms: injected into the LLM system prompt, NOT scanned ---
# The LLM is instructed to avoid these, but they are not scanned in output
# because they appear routinely in Layer-1/2 factual descriptions of what
# third parties did (banks set target prices, institutions added positions,
# buyers entered at lows). Scanning for them generates false positives that
# suppress legitimate reports without blocking any actual advisory output.
prompt_only_terms:
  - term: 目标价 # target price — appears in news "银行下调目标价"
  - term: 增持 # add to position — appears in news "机构增持XX"
  - term: 减持 # reduce position — appears in news "大股东减持"
  - term: 入场 # entry point — appears in news "买家视低点为入场时机"

# context_scan_terms: human-readable prompt-injection form of each term that
# scan_regex_patterns matches contextually (the prompt lists the bare word;
# the scan itself only fires on the advisory-directive framing above).
context_scan_terms:
  - 止损
  - 清仓
