thresholds:
  single_day: 0.05
  d3: 0.15
  d5: 0.20
  near_d3: 0.08
  near_d5: 0.09
  news_spike_min_fresh: 8
  news_spike_ratio: 2.0
  news_spike_min_history: 5
  news_spike_history_runs: 10
  weekend_min_history: 4
  weekend_macro_min_items: 10
caps:
  movers: 20
  quiet: 10
  macro_themes: 3
  macro_links_per_theme: 3
  leads_per_mover: 2
  leads_per_quiet: 3
  searches_per_run: 6
  headlines_per_unit: 2
  ab_dual_top: 3
  accepted_url_skip_days: 7
  weekend_quiet: 5
  weekend_macro_themes: 2
  weekend_searches: 3
extract:
  tavily_batch_max_urls: 20
  tavily_chunks_per_source: 3
  body_max_chars: 2000
  min_body_chars: 300
  max_boilerplate_ratio: 0.35
excluded_domains: [news.google.com, ft.com, wsj.com, barrons.com, foreignpolicy.com, marketwatch.com]
boilerplate_markers: ["Most active", "Day gainers", "Day losers", "Stock splits", "Oops, something went wrong", "Private companies", "Trending tickers", "This article is an Insider exclusive", "All rights reserved", "Companies Mentioned", "Copyright", "Remove ads"]
paywall_markers: ["Subscribe to continue", "subscribers only", "Upgrade options", "Sign in to read", "available only for our paid subscribers", "'Keep me signed in' box", "This headline only article is a sample", "This is a paid press release"]
yahoo_nav_markers: ["Most active", "Day gainers", "Day losers", "Stock splits", "Oops, something went wrong", "Private companies", "Trending tickers"]
body_cleaning:
  paragraph_min_words: 12
  max_words_per_sentence: 80
  paragraph_min_cjk_chars: 30
  residue_line_patterns:
    - '^sign up now'
    - '^skip to'
    - '^#*\s*trading disclosure'
    - '^#\s*yahoo finance$'
    - '^trade \S+ on '
    - 'download the app'
    - 'header logo'
    - '^choose edition'
    - 'advertise with us'
    - '^(e-paper|newsletters|podcasts|rss feed)\b'
    - '^_?file\s*[.\-–]\s'
    - '^markets & news breaking headlines'
    - '^photo:'
    - '^credit:'
    - '^(published|updated)\s+\w+\s+\d'
    - '^set as preferred'
    - '^reviewed by'
    - '^copyright\b|all rights reserved'
    - '^(listen|summarise|summarize)$'
    - '^(cna games|guess word|buzzword|crack the word)'
    - '^#*\s*(description|title|image):'
    - '^\*?\s*[A-Z0-9.^]{1,10}\s+[+-]\d+(\.\d+)?%$'
    - '^#*\s*u\.s\. markets (closed|open)'
    - '^advertisement$'
    - '^\.\.\.$'
    - '^learn more$'
    - '^the above button links to coinbase'
    - 'partially produced with the help of ai tools'
    - '^market news and data brought to you by benzinga'
    - '^to add benzinga news as your preferred source'
    - '^ad$'
    - '^read this article$'
    - '<h5>'
    - '^your free \d+-day \w+ trial ends'
    - '^(close button|facebook|twitter|flipboard|send|reddit|linkedin|messenger|telegram|vk|bluesky|threads|whatsapp)$'
    - '^submit a story$'
    - '^tell us your story\.?$'
    - '^follow us on google news'
    - '^share$'
    - '^\*$'
    - ' via shutterstock$'
  section_block_headings:
    - 'most read'
    - 'related'
    - 'see more on'
    - 'more from'
    - 'recommended'
    - 'trending'
    - 'read more'
    - 'also read'
    - 'posted in'
    - 'connect with us'
    - 'about benzinga'
    - 'read next'
    - 'featured'
