thresholds:
  single_day: 0.05
  d3: 0.15
  d5: 0.20
  near_d3: 0.08
  near_d5: 0.09
  news_spike_min_fresh: 8
  news_spike_ratio: 2.0
  news_spike_min_history: 5
  news_spike_history_runs: 10
  weekend_min_history: 4
  weekend_macro_min_items: 10
caps:
  movers: 20
  quiet: 10
  macro_themes: 3
  macro_links_per_theme: 3
  leads_per_mover: 2
  leads_per_quiet: 3
  searches_per_run: 6
  headlines_per_unit: 2
  ab_dual_top: 3
  accepted_url_skip_days: 7
  weekend_quiet: 5
  weekend_macro_themes: 2
  weekend_searches: 3
extract:
  tavily_batch_max_urls: 20
  tavily_chunks_per_source: 3
  body_max_chars: 2000
  min_body_chars: 300
  max_boilerplate_ratio: 0.35
excluded_domains: [news.google.com, ft.com, wsj.com, barrons.com, foreignpolicy.com, marketwatch.com]
boilerplate_markers: ["Most active", "Day gainers", "Day losers", "Stock splits", "Oops, something went wrong", "Private companies", "Trending tickers", "This article is an Insider exclusive", "All rights reserved", "Companies Mentioned", "Copyright"]
paywall_markers: ["Subscribe to continue", "subscribers only", "Upgrade options", "Sign in to read", "available only for our paid subscribers"]
yahoo_nav_markers: ["Most active", "Day gainers", "Day losers", "Stock splits", "Oops, something went wrong", "Private companies", "Trending tickers"]
body_cleaning:
  paragraph_min_words: 12
  paragraph_min_cjk_chars: 30
  residue_line_patterns:
    - '^sign up now'
    - '^skip to'
    - '^#*\s*trading disclosure'
    - '^#\s*yahoo finance$'
    - '^trade \S+ on '
    - 'download the app'
    - 'header logo'
    - '^choose edition'
    - 'advertise with us'
    - '^(e-paper|newsletters|podcasts|rss feed)\b'
    - '^photo:'
    - '^credit:'
    - '^(published|updated)\s+\w+\s+\d'
    - '^set as preferred'
    - '^reviewed by'
    - '^copyright\b|all rights reserved'
    - '^(listen|summarise|summarize)$'
    - '^(cna games|guess word|buzzword|crack the word)'
    - '^#*\s*(description|title|image):'
    - '^\*?\s*[A-Z0-9.^]{1,10}\s+[+-]\d+(\.\d+)?%$'
    - '^#*\s*u\.s\. markets (closed|open)'
    - '^advertisement$'
    - '^\.\.\.$'
    - '^learn more$'
  section_block_headings:
    - 'most read'
    - 'related'
    - 'see more on'
    - 'more from'
    - 'recommended'
    - 'trending'
    - 'read more'
    - 'also read'

headline_cleaning:
  stale_earnings_days: 14
  earnings_recap_patterns:
    - '\b(Q[1-4]|first|second|third|fourth)[- ]quarter\b.*\b(results|earnings|EPS)\b'
    - '\bQ[1-4]\b.*\b(EPS|earnings|results)\b'
    - '\bEPS (beat|beats|miss|misses)\b'
    - '\bafter earnings\b'
    - '\bearnings (beat|miss)\b'
