# Macro keyword theme table — Ring 0 Edition
# Source: 产品概念设计文档 §7.1.3
#
# Editing rules:
#   - Each theme has a "name" and a list of "keywords".
#   - Single English words (no spaces) use word-boundary matching (\b...\b) to
#     avoid false positives (e.g. "Fed" does not match "Federal").
#   - English phrases (contains space) use case-insensitive substring matching.
#   - Chinese keywords use direct substring matching (no word boundaries).
#   - A news article triggers a theme when ANY keyword matches its title or summary.
#   - Restart the backend after editing to pick up changes (config is loaded on
#     first call per process, not watched for changes).

themes:
  - name: "货币政策"
    keywords:
      - "Federal Reserve"
      - "Fed"
      - "rate hike"
      - "rate cut"
      - "interest rate"
      - "FOMC"
      - "Powell"
      - "quantitative tightening"
      - "quantitative easing"
      - "yield curve"
      - "inflation"
      - "CPI"
      - "PCE"
      - "美联储"
      - "降息"
      - "加息"

  - name: "贸易与关税"
