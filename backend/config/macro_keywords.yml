  # Added 2026-08-22 (product owner review of a candidate list): no existing
  # theme covers US domestic political process (legislation, executive
  # action) as distinct from Fed monetary policy (货币政策, Fed-specific) or
  # tariff actions (贸易与关税) — a real gap given this portfolio's heavy
  # US-equity weighting and tariff/policy sensitivity.
  - name: "美国内政"
    keywords:
      - "Trump"
      - "Congress"
      - "White House"
      - "特朗普"
      - "国会"
      - "白宫"

  # Added 2026-08-22: China-Japan friction (Senkaku/Diaoyu dispute) is a
  # distinct geopolitical axis from 地缘：东亚同盟 (framed as the US-Japan-
  # Korea-Philippines ALLIANCE, not China-Japan TENSION) and from 日债
  # (BOJ/JGB macro, not geopolitics). "yen" is a single English word matched
  # word-boundary — its literary sense ("a yen for adventure") is a small,
  # accepted false-positive surface in a financial-news-only corpus.
  - name: "中日摩擦"
    keywords:
      - "Senkaku"
      - "yen"
      - "尖阁诸岛"
      - "钓鱼岛"
      - "日元"
