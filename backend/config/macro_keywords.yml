  # Widened 2026-08-21 (issue #128 Ring 1 stage B / B1 PR) — the eight themes
  # above were the Ring 0 starting set (Concept §7.1.3) and had gone
  # unexpanded since. §2's prompt now asks the model to SELECT 2-4 themes
  # with genuine evidenced change this window rather than mechanically cover
  # every trigger (report_prompts._SECTION2_INSTRUCTIONS) — that selection
  # is only as good as the candidate pool it selects from, so the pool needed
  # to widen alongside the prompt change, not stay narrow.
  # 2026-08-22 (Grok review, PR #172): the first pass used bare "breakthrough"
  # (English, word-boundary matched — still fires on any ordinary tech
  # marketing headline containing that word) and bare "突破" (Chinese, direct
  # substring — fires on completely unrelated financial phrases like
  # "股价突破新高"/"订单突破百亿"). Tightened to compound phrases that require
  # the qualifying context to be present in the substring itself, not just a
  # generic word that a company/AI PR item, or an unrelated price/order
  # threshold headline, would also trip.
  - name: "科技突破"
    keywords:
      - "scientific breakthrough"
      - "research breakthrough"
      - "technology breakthrough"
      - "quantum computing"
      - "quantum supremacy"
      - "frontier model"
      - "AGI"
      - "科技突破"
      - "重大突破"
      - "技术突破"
      - "量子计算"
      - "量子霸权"

