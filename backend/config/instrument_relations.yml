# Holding relationship table (issue #681). Owner-maintained; changes go through a PR.
#
# Per holding identifier, at most 8 related entities. A headline that names a
# related entity but not the holding is classified for relevance and, if kept,
# stored as a related link shown after the holding's own headlines.
#   name:     display name used in reports
#   aliases:  match terms (same matcher as entity_aliases: CJK substring; Latin
#             word match, case-sensitive for 4 characters or fewer)
#   relation: supplier | customer | competitor | input
# Only [] means "reviewed, no relations"; an empty value is invalid.
# A holding missing here gets a
# suggestion in the weekly name and relation check (Sunday 07:30 ET batch).

