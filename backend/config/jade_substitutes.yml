# Scenario substitutes for proxy and benchmark ETFs (issue #723).
# Keyed by the ETF symbol used in jade_replay_config (CLASS_PROXY,
# STOCK_PROXY_BY_MARKET, BENCHMARK_ETF). Every such symbol must appear;
# [] means no substitute. Candidates are tried in order after the ETF
# itself (Design D5). source: yf = Yahoo Finance download,
# file = CSV under config/jade_scenario_data/.
substitutes:
  SPY: []
  QQQ: []
  XLE: []
  DIA: []
  AGG:
    - {symbol: VBMFX, source: yf, currency: USD, name: "Vanguard Total Bond Market Index Fund", price_only: false}
  EFA:
