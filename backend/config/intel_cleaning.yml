non_article_path_segments: ["/video/", "/videos/", "/watch", "/gallery/", "/podcast", "/slideshow/"]
low_value_title_patterns:
  - 'stocks? to (buy|watch|sell|own)'
  - 'should you (buy|sell)'
  - '\bbuy (now|the dip)\b'
  - 'better buy'
  - '\bvs\.?\s'
  - 'millionaire'
  - 'could (soar|double|triple)'
  - 'price prediction'
  - '^prediction:'
  - 'top \d+ .*stocks'
  - '\d+ (high-yield |dividend |ai |growth )?stocks? (to|that)'
  - 'is it (a buy|time to)'
  - 'worth by 20\d\d'
  - 'too late to buy'
  - 'stock price, news, quote'
  - '\bnews today\b'
  - '\b(purchases|buys|acquires|sells|sold|acquired|purchased)\s+[\d,]+\s+shares\s+of\b'
  - '\b(stake|position|holdings)\s+(increased|decreased|raised|lowered|trimmed|boosted|cut)\s+by\b'
  - '\b(grows|raises|lifts|trims|cuts|boosts|increases|decreases|reduces)\s+(its\s+)?(stake|position|holdings)\s+in\b'
  - '\$[A-Z]{1,5}\s+(stock|shares|position)\s+(acquired|sold|purchased|bought)\s+by\b'
  - '\b(stock|shares)\s+(price\s+)?(up|down)\s+[\d.]+%\s*-\s*here.?s\s+(what happened|why)\b'
  - '\b(out|under)performs\b.*\bcompetitors\b|\bstock\s+(pre-market|after-hours)\s+at\b'
  - '\bstock price today\s*([|,:\-]|$)'
  - '\bstock price, quote\b'
  - '\blatest stock news and headlines\b'
  - '\.US\)\$'
  - '\b(class action notice|deadline alert)\b'
  - '^investor alert\b'
  - '^form 4\b'
near_duplicate_jaccard: 0.8
near_duplicate_hours: 48
# Issue #681: kept related-company headlines per instrument per attempt.
related_per_instrument: 3
