# Portfonia Ring 0 — log rotation for .run/*.log
#
# Setup (one-time, requires logrotate: brew install logrotate):
#   Add to crontab (crontab -e):
#   0 2 * * 0  /usr/local/bin/logrotate -s ~/.logrotate.portfonia.state /Users/garyj/Portfonia/backend/.logrotate.conf
#
# copytruncate: copy then truncate in place so the nohup-redirected fd
# (uvicorn/celery append to the same file descriptor) keeps working without
# a process restart or signal.

/Users/garyj/Portfonia/backend/.run/uvicorn.log
/Users/garyj/Portfonia/backend/.run/worker.log
/Users/garyj/Portfonia/backend/.run/beat.log
{
    weekly
    rotate 8
    compress
    missingok
    notifempty
    copytruncate
}
