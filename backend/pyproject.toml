[project]
name = "portfonia-backend"
version = "0.0.1"
description = "Portfonia backend (FastAPI + Celery)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in default args is the intended pattern
]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["venv/", "alembic/versions/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "pandas.*", "feedparser.*", "feedparser", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app"]
python_files = ["test_*.py", "*_test.py"]
