services:
  postgres:
    image: postgres:16-alpine
    container_name: portfonia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-portfonia_dev}
      POSTGRES_USER: ${DB_USER:-portfonia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-portfonia} -d ${DB_NAME:-portfonia_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: portfonia-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Production-only services below (dev runs backend/worker/beat/frontend
  # natively on the host — see "Local Development Environment" in
  # Hermes/Portfonia/Portfonia Environment Config.md).
  # `docker-compose up -d postgres redis` for dev, `docker-compose up -d`
  # (no service args) brings up everything, for prod. ----

  migrate:
    build:
      context: ./backend
    container_name: portfonia-migrate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: portfonia-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-worker:
    build:
      context: ./backend
    container_name: portfonia-celery-worker
    restart: unless-stopped
    env_file: .env
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-beat:
    build:
      context: ./backend
    container_name: portfonia-celery-beat
    restart: unless-stopped
    env_file: .env
    command: ["celery", "-A", "app.tasks", "beat", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        # See frontend/Dockerfile's comment: this is deliberately NOT
        # ${SUPABASE_URL} (the backend's raw project host) — the browser
        # needs the auth.portfonia.com reverse proxy, not a direct
        # supabase.co connection (Ring 1-B design doc §2.7/§6.10/§7.3(5)).
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_AUTH_URL:-https://auth.portfonia.com}
        # Fail closed like SUPABASE_PROJECT_HOST below, not a silent empty
        # string: NEXT_PUBLIC_* is baked in at `next build`, so an unset key
        # here would still produce a "successful" build — just one that
        # throws on every request once deployed (blacktomb42 review, PR
        # #185). The Dockerfile has its own belt-and-suspenders check too,
        # for a raw `docker build` that bypasses this interpolation.
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?required}
    container_name: portfonia-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: portfonia-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SUPABASE_PROJECT_HOST: ${SUPABASE_PROJECT_HOST:?required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.data/caddy_data:/data
      - ./.data/caddy_config:/config
    depends_on:
      - backend
      - frontend
